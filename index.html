<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawNight Lotto Max Lab</title>
<meta name="description" content="Independent Lotto Max results since 2009, statistics and a fair random number generator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Draw night: one dark stage, gold balls are the only loud thing. Long scroll, sticky rail of four sections. */
  --night:#090d1d; --stage:#111733; --rail:#1a2146; --line:#2b3566;
  --ink:#f4f0e4; --dim:#a7aecb; --gold:#f6bb45; --gold-deep:#b9790a; --bonus:#62d6c6; --bar:#8494dc; --warn:#ff9d7a;
  --display:"Big Shoulders Display","Figtree","PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --body:"Figtree","PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei","Noto Sans TC","Noto Sans SC","Nirmala UI","Noto Sans Gurmukhi","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.55 var(--body);
  background-image:radial-gradient(900px 420px at 18% -80px,#27307099,transparent 70%),radial-gradient(700px 380px at 95% 0,#3a2a0a66,transparent 70%);background-repeat:no-repeat}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.6vw,46px);text-transform:uppercase}
h3{font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top rail */
.top{position:sticky;top:0;z-index:20;background:#090d1de6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:56px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff3c4,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 14px #f6bb4588}
.top nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
.top nav a{color:var(--dim);text-decoration:none;padding:6px 10px;border-radius:6px;font-weight:600;font-size:15px}
.top nav a:hover{color:var(--ink);background:var(--rail)}
select,input[type=text],input[type=date]{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
select:hover,input:hover{border-color:var(--dim)}

/* balls */
.ball{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rail);border:1px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.ball.bonus{background:transparent;border:1.5px solid var(--bonus);color:var(--bonus)}
.ball.gold{background:radial-gradient(circle at 32% 26%,#fff6d0,var(--gold) 42%,var(--gold-deep));color:#201503;border:0;box-shadow:inset 0 -3px 6px #0003}
.balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plus{color:var(--dim);font-weight:700;padding:0 2px}

/* hero */
.hero{padding:44px 0 36px}
.hero .wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:36px;align-items:end}
.kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:clamp(40px,6.4vw,76px);text-transform:uppercase;margin:10px 0 26px}
.latest-label{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;color:var(--dim);margin-bottom:12px}
.latest-label b{color:var(--ink);font-size:18px}
.hero .balls{gap:10px}
.hero .ball{width:clamp(38px,5.4vw,60px);height:clamp(38px,5.4vw,60px);font-family:var(--display);font-weight:800;font-size:clamp(21px,3vw,34px)}
.hero .ball.gold{box-shadow:inset 0 -5px 10px #0003,0 0 26px #f6bb4540}
.hero .ball.bonus{border-width:2px}
.side{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side div{background:var(--stage);padding:14px 18px}
.side small{display:block;color:var(--dim);font-size:13px}
.side b{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.02em}
.side .next b{color:var(--gold)}
.note{margin-top:14px;color:var(--dim);font-size:14px}
.note.warn{color:var(--warn)}

section{padding:52px 0;border-top:1px solid var(--line)}
.sub{color:var(--dim);max-width:68ch;margin:10px 0 22px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters label{display:grid;gap:4px;font-size:13px;color:var(--dim);font-weight:600}
.btn{background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold);color:var(--gold)}

/* history table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--stage)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;color:var(--dim)}
.tfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;color:var(--dim);font-size:14px}

/* analysis */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--dim);font-weight:600}
.tabs button:hover{color:var(--ink);border-color:var(--dim)}
.tabs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#201503}
.panel{background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:22px}
.cap{color:var(--dim);font-size:14px;margin-bottom:14px;max-width:75ch}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.chartwrap{overflow-x:auto;padding-top:8px}
.filters label.check{display:flex}
.chart{display:grid;grid-template-columns:auto 1fr;column-gap:8px;min-width:var(--minw,0)}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.yax span{line-height:1;transform:translateY(-50%)}.yax span:last-child{transform:translateY(50%)}
.plot{height:220px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--dim);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bar{width:100%;max-width:38px;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.col:hover .bar{background:var(--gold)}
.tick{position:absolute;left:0;right:0;margin:auto;max-width:42px;height:2px;background:var(--ink);box-shadow:0 0 0 1px var(--stage)}
.xax{grid-column:2;display:flex;gap:2px;font-size:11px;color:var(--dim);padding-top:6px;font-variant-numeric:tabular-nums}
.xax span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .lb{width:12px;height:12px;background:var(--bar);border-radius:3px 3px 0 0}.legend .lt{width:16px;height:2px;background:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.rank{display:grid;gap:8px;margin-top:10px}
.rank div{display:flex;align-items:center;gap:10px}
.rank .meter{flex:1;height:8px;background:var(--rail);border-radius:4px;overflow:hidden;min-width:30px}
.rank .meter i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.rank span.v{color:var(--dim);font-size:14px;font-variant-numeric:tabular-nums;min-width:8ch;text-align:right}
#tip{position:fixed;z-index:50;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:260px;display:none}

/* patterns */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;background:var(--stage);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card{box-shadow:0 0 0 1px var(--line);padding:20px 22px;display:grid;gap:10px;align-content:start}
.card p{color:var(--dim);font-size:15px}
.chip{justify-self:start;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px;border:1px solid var(--bonus);color:var(--bonus)}
.chip.watch{border-color:var(--warn);color:var(--warn)}
.chip::before{content:"✓ "}.chip.watch::before{content:"! "}

/* generator */
.gen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.opts{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row output{font-family:var(--display);font-size:28px;font-weight:800;color:var(--gold);min-width:2ch}
input[type=range]{accent-color:var(--gold);flex:1;min-width:140px}
.hint{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-top:8px}
.grid button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--rail);cursor:pointer;font-weight:700;font-size:14px;padding:0}
.grid button:hover{border-color:var(--dim)}
.grid button.inc{background:var(--gold);color:#201503;border-color:var(--gold)}
.grid button.exc{background:transparent;color:#6c7499;text-decoration:line-through;border-style:dashed}
.grid button.auto{opacity:.35}
.keyl{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:8px}
.keyl i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.machine{position:sticky;top:76px;display:grid;gap:18px}
.drumrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.drum{width:120px;height:120px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,#2a3470,#0c1024 70%);position:relative;flex:none;box-shadow:inset 0 0 30px #000a}
.drum b{position:absolute;inset:0;animation:spin 14s linear infinite}
.drum b:nth-child(2){animation-duration:19s;animation-direction:reverse}
.drum b i{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff6d0,var(--gold) 45%,var(--gold-deep))}
.drum.spin b{animation-duration:.7s}.drum.spin b:nth-child(2){animation-duration:.95s}
@keyframes spin{to{transform:rotate(360deg)}}
.go{background:var(--gold);color:#201503;border:0;border-radius:12px;padding:14px 26px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:56px}
.go:hover{background:#ffd06d}.go:disabled{opacity:.6;cursor:wait}
.lines{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .lab{font-family:var(--display);font-weight:600;font-size:18px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;min-width:5ch}
.lrow .meta{grid-column:2;font-size:13px;color:var(--dim)}
.lrow .ball{width:40px;height:40px;font-size:17px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.lrow .ball.wait{opacity:0;transform:scale(.3) translateY(-14px)}
.msg{color:var(--warn);font-size:14px;min-height:1.4em}
footer{border-top:1px solid var(--line);padding:32px 0 60px;color:var(--dim);font-size:13.5px}
footer p{max-width:85ch;margin-bottom:10px}
@media (max-width:860px){.hero .wrap,.gen,.two{grid-template-columns:1fr}.machine{position:static}.top .wrap{gap:6px 12px}.top nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto}.top nav a{padding:4px 8px;font-size:14px;white-space:nowrap}#lang{margin-left:auto}html{scroll-padding-top:110px}}
:lang(zh) h1{font-size:clamp(34px,5vw,58px);line-height:1.15}
:lang(pa) h1,:lang(hi) h1{font-size:clamp(30px,4.4vw,52px);line-height:1.35}
:lang(pa) h2,:lang(hi) h2,:lang(pa) h3,:lang(hi) h3{line-height:1.4}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drum b{animation:none}.lrow .ball{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top"><i></i>DrawNight</a>
  <nav>
    <a href="#results" data-i18n="nav_history"></a>
    <a href="#analysis" data-i18n="nav_analysis"></a>
    <a href="#patterns" data-i18n="nav_patterns"></a>
    <a href="#generator" data-i18n="nav_generator"></a>
  </nav>
  <select id="lang" aria-label="Language">
    <option value="en">English</option><option value="fr">Français</option><option value="zh-Hant">繁體中文</option>
    <option value="zh-Hans">简体中文</option><option value="pa">ਪੰਜਾਬੀ</option><option value="hi">हिन्दी</option>
  </select>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
  <div>
    <div class="kicker" data-i18n="hero_kicker"></div>
    <h1 data-i18n="hero_title"></h1>
    <div class="latest-label"><span data-i18n="hero_latest"></span><b id="latestDate"></b></div>
    <div class="balls" id="latestBalls"></div>
    <p class="note" id="fresh"></p>
  </div>
  <div class="side">
    <div class="next"><small data-i18n="next_draw"></small><b id="nextDraw"></b></div>
    <div><small data-i18n="draws_on_file"></small><b id="nDraws"></b></div>
    <div><small data-i18n="pool_now"></small><b id="poolNow"></b></div>
    <div><small data-i18n="odds_line"></small><b id="odds"></b></div>
  </div>
</div></div>

<section id="results"><div class="wrap">
  <h2 data-i18n="h_title"></h2>
  <p class="sub" data-i18n="h_sub"></p>
  <div class="filters">
    <label><span data-i18n="f_year"></span><select id="fYear"></select></label>
    <label><span data-i18n="f_day"></span><select id="fDow"></select></label>
    <label><span data-i18n="f_from"></span><input type="date" id="fFrom"></label>
    <label><span data-i18n="f_to"></span><input type="date" id="fTo"></label>
    <label><span data-i18n="f_nums"></span><input type="text" id="fNums" inputmode="numeric" size="12"></label>
    <button class="btn" id="fReset" data-i18n="reset"></button>
  </div>
  <div class="tablewrap"><table><thead><tr>
    <th data-i18n="col_date"></th><th data-i18n="col_numbers"></th><th data-i18n="col_sum"></th><th data-i18n="col_oe"></th>
  </tr></thead><tbody id="hBody"></tbody></table></div>
  <div class="tfoot"><span id="hCount"></span><button class="btn" id="hMore" data-i18n="more"></button><button class="btn" id="hAll"></button></div>
</div></section>

<section id="analysis"><div class="wrap">
  <h2 data-i18n="a_title"></h2>
  <p class="sub" data-i18n="a_sub"></p>
  <div class="filters">
    <label><span data-i18n="scope"></span><select id="aScope"></select></label>
    <label class="check" style="color:var(--ink);font-size:15px;font-weight:400;padding-bottom:9px"><input type="checkbox" id="aBonus"><span data-i18n="inc_bonus"></span></label>
  </div>
  <div class="tabs" id="aTabs"></div>
  <div class="panel" id="aPanel"></div>
</div></section>

<section id="patterns"><div class="wrap">
  <h2 data-i18n="p_title"></h2>
  <p class="sub" id="pSub"></p>
  <div class="cards" id="pCards"></div>
</div></section>

<section id="generator"><div class="wrap">
  <h2 data-i18n="g_title"></h2>
  <p class="sub" data-i18n="g_sub"></p>
  <div class="gen">
    <div class="panel opts">
      <h3 data-i18n="gf_title"></h3>
      <div><label for="gLines" data-i18n="g_lines"></label>
        <div class="row"><input type="range" id="gLines" min="1" max="10" value="4"><output id="gLinesOut">4</output></div></div>
      <div><label for="gExlast" data-i18n="g_exlast"></label>
        <div class="row"><select id="gExlast"></select></div><div class="hint" id="gExlastList"></div></div>
      <label class="check"><input type="checkbox" id="gExcombo" checked><span data-i18n="g_excombo"></span></label>
      <label class="check"><input type="checkbox" id="gSum"><span id="gSumLbl"></span></label>
      <label class="check"><input type="checkbox" id="gOe"><span data-i18n="g_oe"></span></label>
      <label class="check"><input type="checkbox" id="gRun"><span data-i18n="g_run"></span></label>
      <label class="check"><input type="checkbox" id="gBday"><span data-i18n="g_bday"></span></label>
      <div><b data-i18n="g_grid"></b><div class="hint" data-i18n="g_grid_help"></div>
        <div class="grid" id="gGrid"></div>
        <div class="keyl"><span><i style="background:var(--gold)"></i><span data-i18n="lg_inc"></span></span><span><i style="border:1px dashed var(--dim)"></i><span data-i18n="lg_exc"></span></span></div></div>
    </div>
    <div class="machine">
      <div class="drumrow">
        <div class="drum" id="drum" aria-hidden="true"><b></b><b></b></div>
        <div style="display:grid;gap:10px;flex:1;min-width:200px">
          <button class="go" id="gGo" data-i18n="g_draw"></button>
          <div class="hint" id="gPass"></div>
        </div>
      </div>
      <div class="msg" id="gMsg" role="status"></div>
      <div class="panel"><div class="lines" id="gOut"></div>
        <div class="tfoot"><button class="btn" id="gCopy" data-i18n="copy" hidden></button></div></div>
    </div>
  </div>
</div></section>
</main>

<footer><div class="wrap">
  <p data-i18n="foot_play"></p><p data-i18n="foot_ind"></p><p data-i18n="foot_src"></p><p id="footData"></p>
</div></footer>
<div id="tip" role="tooltip"></div>
<script>
const I18N={

col_date:"Date",col_numbers:"Winning numbers + bonus",col_sum:"Sum",col_oe:"Odd : Even",

gap_cap:"Draws since each number last appeared, longest wait first.",gap_never:"Never drawn in this period",gap_none:"Every number has appeared at least once.",gap_unit:"{g} draws ago",

const iso=k=>{const s=String(k);return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6)};
function mk(k,n,b){const d=iso(k);return{k,d,n,b,pool:poolOf(k),dow:new Date(d+'T00:00:00Z').getUTCDay(),sum:n.reduce((a,x)=>a+x,0),odd:n.filter(x=>x&1).length}}
let DRAWS=RAW.map(a=>mk(a[0],a.slice(1,8),a[8])),PAST=new Set();
const LOC={en:'en-CA',fr:'fr-CA','zh-Hant':'zh-Hant','zh-Hans':'zh-Hans',pa:'pa-IN',hi:'hi-IN'};
const S={lang:'en',h:{year:'',dow:'',from:'',to:'',nums:[],limit:10},a:{scope:'cur',view:'freq',bonus:false},
  g:{lines:4,exlast:0,excombo:true,sum:false,oe:false,run:false,bday:false,inc:new Set(),exc:new Set()},out:[],busy:false};
const last=()=>DRAWS[DRAWS.length-1],POOL=()=>last().pool;
function t(k,v){let s=(I18N[S.lang]&&I18N[S.lang][k])||I18N.en[k]||k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function fmtDate(d,o){try{return new Intl.DateTimeFormat(LOC[S.lang],Object.assign({weekday:'short',year:'numeric',month:'short',day:'numeric',timeZone:'UTC'},o)).format(new Date(d+'T00:00:00Z'))}catch(e){return d}}
const nf=n=>{try{return n.toLocaleString(LOC[S.lang])}catch(e){return String(n)}};
const pc=(x,d=1)=>(x*100).toFixed(d);
const comb=(n,k)=>{if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r)};
const ball=(v,c='')=>`<span class="ball ${c}">${v}</span>`;
const ballsHtml=(d,c='')=>d.n.map(v=>ball(v,c)).join('')+`<span class="plus">+</span><span class="ball bonus" title="${t('bonus')}">${d.b}</span>`;

/* ---------- maths ---------- */
function lgam(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,1.208650973866179e-3,-5.395239384953e-6];let y=x,tmp=x+5.5;tmp-=(x+.5)*Math.log(tmp);let s=1.000000000190015;for(const cj of c)s+=cj/++y;return-tmp+Math.log(2.5066282746310005*s/x)}
function gammq(a,x){if(x<=0)return 1;const pre=Math.exp(-x+a*Math.log(x)-lgam(a));
  if(x<a+1){let ap=a,sum=1/a,del=sum;for(let i=0;i<1000;i++){ap++;del*=x/ap;sum+=del;if(Math.abs(del)<Math.abs(sum)*1e-13)break}return 1-sum*pre}
  let b=x+1-a,c=1e300,d=1/b,h=d;for(let i=1;i<1000;i++){const an=-i*(i-a);b+=2;d=an*d+b;if(Math.abs(d)<1e-300)d=1e-300;c=b+an/c;if(Math.abs(c)<1e-300)c=1e-300;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<1e-13)break}return pre*h}
function chiP(ds,N){const m=ds.length;if(m<20)return null;const c=new Array(N+1).fill(0);ds.forEach(d=>d.n.forEach(v=>c[v]++));const E=m*7/N;let x=0;for(let v=1;v<=N;v++)x+=(c[v]-E)**2/E;x*=(N-1)/(N-7);return gammq((N-1)/2,x/2)}
const pOdd=(N,k)=>{const O=Math.ceil(N/2);return comb(O,k)*comb(N-O,7-k)/comb(N,7)};
const pRep=(N,j)=>comb(7,j)*comb(N-7,7-j)/comb(N,7);
const pCons=N=>1-comb(N-6,7)/comb(N,7);
const avgPool=(ds,f)=>ds.reduce((a,d)=>a+f(d.pool),0)/ds.length;
const hasCons=n=>n.some((v,i)=>i&&v-n[i-1]===1);
function pctl(ds,q){const s=ds.map(d=>d.sum).sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.floor(s.length*q))]}
const modern=()=>DRAWS.filter(d=>d.pool>=50);
const sumRange=()=>{const m=modern();return[pctl(m,.1),pctl(m,.9)]};

/* ---------- hero ---------- */
function todayET(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
const addDay=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*864e5).toISOString().slice(0,10);
const isDrawDay=d=>{const w=new Date(d+'T00:00:00Z').getUTCDay();return w===2||w===5};
function schedule(){const L=last().d,T=todayET();let missing=0;for(let d=addDay(L,1);d<T;d=addDay(d,1))if(isDrawDay(d))missing++;
  let nx=T>L?T:addDay(L,1);while(!isDrawDay(nx))nx=addDay(nx,1);return{missing,next:nx,tonight:nx===T}}
function renderHero(){const L=last(),sc=schedule();
  $('#latestDate').textContent=fmtDate(L.d,{weekday:'long',month:'long'});
  $('#latestBalls').innerHTML=ballsHtml(L,'gold');
  $('#nextDraw').textContent=sc.tonight?t('tonight'):fmtDate(sc.next,{year:undefined});
  $('#nDraws').textContent=nf(DRAWS.length);$('#poolNow').textContent='1–'+L.pool;$('#odds').textContent='1 / '+nf(comb(L.pool,7));
  const f=$('#fresh');f.className='note'+(sc.missing?' warn':'');f.textContent=sc.missing?t('stale',{n:sc.missing}):t('data_through',{date:fmtDate(L.d)});
  $('#footData').textContent=t('data_through',{date:fmtDate(L.d)})+' · '+nf(DRAWS.length)}

/* ---------- history ---------- */
function histList(){const h=S.h;return DRAWS.filter(d=>(!h.year||d.d.slice(0,4)===h.year)&&(!h.dow||d.dow===+h.dow)&&(!h.from||d.d>=h.from)&&(!h.to||d.d<=h.to)&&h.nums.every(v=>d.n.includes(v)||d.b===v)).reverse()}
function renderHist(){const all=histList(),rows=all.slice(0,S.h.limit);
  $('#hBody').innerHTML=rows.length?rows.map(d=>`<tr><td>${fmtDate(d.d)}</td><td><div class="balls">${ballsHtml(d)}</div></td><td class="num">${d.sum}</td><td class="num">${d.odd} : ${7-d.odd}</td></tr>`).join(''):`<tr><td colspan="4">${t('none')}</td></tr>`;
  $('#hCount').textContent=t('h_count',{a:nf(rows.length),b:nf(all.length)});
  const more=all.length>rows.length;$('#hMore').hidden=!more;$('#hAll').hidden=!more;$('#hAll').textContent=t('show_all',{b:nf(all.length)})}
function histOptions(){const ys=[...new Set(DRAWS.map(d=>d.d.slice(0,4)))].reverse();
  $('#fYear').innerHTML=`<option value="">${t('all')}</option>`+ys.map(y=>`<option>${y}</option>`).join('');$('#fYear').value=S.h.year;
  $('#fDow').innerHTML=`<option value="">${t('all')}</option><option value="2">${t('tue')}</option><option value="5">${t('fri')}</option>`;$('#fDow').value=S.h.dow;
  $('#fNums').placeholder=t('f_nums_ph');$('#fFrom').min=$('#fTo').min=DRAWS[0].d;$('#fFrom').max=$('#fTo').max=last().d}

/* ---------- charts ---------- */
function barChart(items,o={}){let mx=0;items.forEach(i=>{mx=Math.max(mx,i.v,i.e||0)});const step=mx>40?20:mx>16?10:mx>8?4:2;mx=Math.max(step,Math.ceil(mx/step)*step);
  const cols=items.map(i=>`<div class="col" data-tip="${i.tip}"><div class="bar" style="height:${i.v/mx*100}%"></div>${i.e!=null?`<i class="tick" style="bottom:${i.e/mx*100}%"></i>`:''}</div>`).join('');
  const xs=items.map(i=>`<span>${i.show===false?'':i.l}</span>`).join('');
  return`<div class="chartwrap"><div class="chart" style="--minw:${o.minw||0}px"><div class="yax"><span>${mx}%</span><span>${mx/2}%</span><span>0</span></div><div class="plot">${cols}</div><div class="xax">${xs}</div></div></div>`+
    (o.legend?`<div class="legend"><span><i class="lb"></i>${t('observed')}</span><span><i class="lt"></i>${t('expected')}</span></div>`:'')}
function rankList(rows,mx){return`<div class="rank">${rows.map(r=>`<div>${r.h}<span class="meter"><i style="width:${Math.max(2,r.v/mx*100)}%"></i></span><span class="v">${r.t}</span></div>`).join('')}</div>`}

/* ---------- analysis ---------- */
const SCOPES=['cur','e50','e49','all','l50','l100'],VIEWS=['freq','gap','pairs','oe','sum','rep'];
function scopeDraws(){const s=S.a.scope;if(s==='cur')return DRAWS.filter(d=>d.k>=ERAS[0][0]);if(s==='e50')return DRAWS.filter(d=>d.pool===50);if(s==='e49')return DRAWS.filter(d=>d.pool===49);if(s==='l50')return DRAWS.slice(-50);if(s==='l100')return DRAWS.slice(-100);return DRAWS}
const picks=d=>S.a.bonus?d.n.concat(d.b):d.n;
function freqData(ds){const N=Math.max(...ds.map(d=>d.pool)),k=S.a.bonus?8:7,out=[];
  for(let v=1;v<=N;v++){let c=0,el=0,ex=0;for(const d of ds){if(d.pool<v)continue;el++;ex+=k/d.pool;if(picks(d).includes(v))c++}out.push({v,c,el,p:el?c/el:0,e:el?ex/el:0})}return out}
function renderAnalysis(){const ds=scopeDraws(),m=ds.length,v=S.a.view,N=Math.max(...ds.map(d=>d.pool));let h=`<p class="cap"><b style="color:var(--ink)">${t('n_draws',{n:nf(m)})}</b> · `;
  if(v==='freq'){const f=freqData(ds),by=f.slice().sort((a,b)=>b.p-a.p||a.v-b.v),mx=by[0].p;
    const row=x=>({h:ball(x.v),v:x.p,t:`${x.c}× · ${pc(x.p)}%`});
    h+=t('freq_cap')+'</p>'+barChart(f.map(x=>({l:x.v,v:x.p*100,e:x.e*100,show:x.v===1||x.v%5===0,tip:t('tip_freq',{n:x.v,c:x.c,m:x.el,p:pc(x.p),e:pc(x.e)})})),{minw:620,legend:1})+
      `<div class="two"><div><h3>${t('hot')}</h3>${rankList(by.slice(0,7).map(row),mx)}</div><div><h3>${t('cold')}</h3>${rankList(by.slice(-7).reverse().map(row),mx)}</div></div>`}
  else if(v==='gap'){const g=[];const never=[];for(let x=1;x<=N;x++){let idx=-1;for(let i=m-1;i>=0;i--)if(picks(ds[i]).includes(x)){idx=i;break}idx<0?never.push(x):g.push({v:x,g:m-1-idx})}
    g.sort((a,b)=>b.g-a.g);const top=g.slice(0,12),mx=top[0]?Math.max(1,top[0].g):1;
    h+=t('gap_cap')+'</p>'+rankList(top.map(x=>({h:ball(x.v),v:x.g,t:t('gap_unit',{g:x.g})})),mx)+
      `<div style="margin-top:22px"><h3>${t('gap_never')}</h3><div class="balls" style="margin-top:10px">${never.length?never.map(x=>ball(x)).join(''):`<span class="cap" style="margin:0">${t('gap_none')}</span>`}</div>`+
      (S.a.scope==='all'||S.a.scope==='e50'||S.a.scope==='e49'?`<p class="cap" style="margin-top:12px">${t('gap_note51')}</p>`:'')+'</div>'}
  else if(v==='pairs'){const P=new Map(),T=new Map();for(const d of ds){const n=d.n;for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){const a=n[i]*100+n[j];P.set(a,(P.get(a)||0)+1);for(let k=j+1;k<7;k++){const b=a*100+n[k];T.set(b,(T.get(b)||0)+1)}}}
    const top=(M,n)=>[...M].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).slice(0,n);const tp=top(P,12),tt=top(T,8);
    const ex=ds.reduce((a,d)=>a+42/(d.pool*(d.pool-1)),0);
    const dec=(k,n)=>{const o=[];for(let i=0;i<n;i++){o.unshift(k%100);k=Math.floor(k/100)}return`<span class="balls">${o.map(x=>ball(x)).join('')}</span>`};
    h+=t('pairs_cap',{m:nf(m),e:ex.toFixed(1)})+`</p><div class="two" style="margin-top:0"><div><h3>${t('pairs_t')}</h3>${rankList(tp.map(x=>({h:dec(x[0],2),v:x[1],t:x[1]+'×'})),tp[0][1])}</div><div><h3>${t('trip_t')}</h3>${rankList(tt.map(x=>({h:dec(x[0],3),v:x[1],t:x[1]+'×'})),tt[0][1])}</div></div>`}
  else if(v==='oe'){const c=new Array(8).fill(0);ds.forEach(d=>c[d.odd]++);
    h+=t('oe_cap')+'</p>'+barChart(c.map((x,k)=>{const e=avgPool(ds,p=>pOdd(p,k)),l=t('odd_n',{k});return{l,v:x/m*100,e:e*100,tip:t('tip_dist',{l,p:pc(x/m),e:pc(e)})}}),{legend:1})}
  else if(v==='sum'){const lo=Math.floor(Math.min(...ds.map(d=>d.sum))/20)*20,hi=Math.max(...ds.map(d=>d.sum)),bins=[];for(let b=lo;b<=hi;b+=20)bins.push({b,c:0});ds.forEach(d=>bins[Math.floor((d.sum-lo)/20)].c++);
    h+=t('sum_cap',{a:pctl(ds,.1),b:pctl(ds,.9)})+'</p>'+barChart(bins.map(x=>{const l=x.b+'–'+(x.b+19);return{l,v:x.c/m*100,tip:t('tip_sum',{l,c:x.c,p:pc(x.c/m)})}}),{minw:560})}
  else{const c=[0,0,0,0];let cons=0;ds.forEach((d,i)=>{if(hasCons(d.n))cons++;if(i){const j=d.n.filter(x=>ds[i-1].n.includes(x)).length;c[Math.min(3,j)]++}});const mm=Math.max(1,m-1);
    h+=t('rep_cap')+'</p>'+barChart(c.map((x,j)=>{const e=avgPool(ds,p=>j<3?pRep(p,j):1-pRep(p,0)-pRep(p,1)-pRep(p,2)),l=t('rep_n',{k:j<3?j:'3+'});return{l,v:x/mm*100,e:e*100,tip:t('tip_dist',{l,p:pc(x/mm),e:pc(e)})}}),{legend:1})+
      `<p class="cap" style="margin:18px 0 0">${t('rep_cons',{p:pc(cons/m),e:pc(avgPool(ds,pCons))})}</p>`}
  $('#aPanel').innerHTML=h}
function analysisOptions(){$('#aScope').innerHTML=SCOPES.map(s=>`<option value="${s}">${t('sc_'+s)}</option>`).join('');$('#aScope').value=S.a.scope;
  $('#aTabs').innerHTML=VIEWS.map(v=>`<button data-v="${v}" aria-pressed="${v===S.a.view}">${t('v_'+v)}</button>`).join('')}

/* ---------- patterns ---------- */
let CLOSE=null;
function closest(){if(CLOSE&&CLOSE.n===DRAWS.length)return CLOSE;const lo=[],hi=[];DRAWS.forEach(d=>{let a=0,b=0;d.n.forEach(v=>v<=26?a|=1<<v:b|=1<<(v-26));lo.push(a);hi.push(b)});
  const pop=x=>{x-=x>>>1&0x55555555;x=(x&0x33333333)+(x>>>2&0x33333333);return(x+(x>>>4)&0xf0f0f0f)*0x1010101>>>24};let best=[0,0,0];
  for(let i=0;i<lo.length;i++)for(let j=i+1;j<lo.length;j++){const k=pop(lo[i]&lo[j])+pop(hi[i]&hi[j]);if(k>best[0])best=[k,i,j]}return CLOSE={n:DRAWS.length,k:best[0],a:DRAWS[best[1]],b:DRAWS[best[2]]}}
function renderPatterns(){const ds=DRAWS,m=ds.length,md=modern(),r=sumRange(),cl=closest(),cur=ds.filter(d=>d.k>=ERAS[0][0]);
  const pv=N=>{const p=chiP(ds.filter(d=>d.pool===N),N);return p==null?'–':p.toFixed(2)};
  const ps=[49,50,52].map(N=>chiP(ds.filter(d=>d.pool===N),N)).filter(p=>p!=null);
  const o34=ds.filter(d=>d.odd===3||d.odd===4).length/m,e34=avgPool(ds,p=>pOdd(p,3)+pOdd(p,4));
  const oc=ds.filter(d=>hasCons(d.n)).length/m,ec=avgPool(ds,pCons);
  let rp=0;for(let i=1;i<m;i++)if(ds[i].n.some(x=>ds[i-1].n.includes(x)))rp++;const or_=rp/(m-1),er=avgPool(ds,p=>1-pRep(p,0));
  const bd=ds.filter(d=>d.n[6]<=31).length;
  const cards=[['p1',{a:pv(49),b:pv(50),c:pv(52)},ps.every(p=>p>.01)],['p2',{a:r[0],b:r[1],n:nf(md.length)},1],['p3',{o:pc(o34),e:pc(e34)},1],['p4',{o:pc(oc),e:pc(ec)},1],['p5',{o:pc(or_),e:pc(er)},1],
    ['p6',{n:nf(m),k:cl.k,d1:fmtDate(cl.a.d),d2:fmtDate(cl.b.d)},1],['p7',{c:bd,o:pc(bd/m)},1],['p8',{n:cur.length},0]];
  $('#pSub').textContent=t('p_sub',{n:nf(m)});
  $('#pCards').innerHTML=cards.map(([k,v,ok])=>`<div class="card"><h3>${t(k+'_t')}</h3><p>${t(k+'_b',v)}</p><span class="chip${ok?'':' watch'}">${t(ok?'verdict_ok':'verdict_watch')}</span></div>`).join('')}

/* ---------- generator ---------- */
function rint(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function genCtx(){const N=POOL(),g=S.g,lastN=new Set();if(g.exlast)DRAWS.slice(-g.exlast).forEach(d=>d.n.forEach(x=>lastN.add(x)));
  const inc=[...g.inc].filter(x=>x<=N).sort((a,b)=>a-b),avail=[];for(let v=1;v<=N;v++)if(!g.inc.has(v)&&!g.exc.has(v)&&!lastN.has(v))avail.push(v);
  return{N,inc,avail,lastN,need:7-inc.length,range:sumRange()}}
function sample(c,r){const a=c.avail.slice(),out=c.inc.slice();for(let i=0;i<c.need;i++){const j=i+r(a.length-i),x=a[i];a[i]=a[j];a[j]=x;out.push(a[i])}return out.sort((x,y)=>x-y)}
function passes(l,c){const g=S.g;if(g.sum){const s=l.reduce((a,x)=>a+x,0);if(s<c.range[0]||s>c.range[1])return false}
  if(g.oe){const o=l.filter(x=>x&1).length;if(o<2||o>5)return false}
  if(g.run)for(let i=0;i<5;i++)if(l[i+1]-l[i]===1&&l[i+2]-l[i+1]===1)return false;
  if(g.bday&&l[6]<=31)return false;if(g.excombo&&PAST.has(l.join('-')))return false;return true}
function passRate(){const c=genCtx();if(c.avail.length<c.need)return 0;let ok=0;const M=3000,r=n=>Math.floor(Math.random()*n);for(let i=0;i<M;i++)if(passes(sample(c,r),c))ok++;
  return comb(c.avail.length,c.need)/comb(c.N,7)*ok/M}
function drawLines(){const c=genCtx(),out=[],seen=new Set();if(c.avail.length<c.need)return null;
  for(let n=0;n<S.g.lines;n++){let l=null;for(let i=0;i<60000;i++){const x=sample(c,rint),key=x.join('-');if(!seen.has(key)&&passes(x,c)){l=x;seen.add(key);break}}if(!l)return out.length?out:null;out.push(l)}return out}
function renderGenStatic(){const g=S.g,c=genCtx(),N=c.N;
  $('#gLines').value=g.lines;$('#gLinesOut').textContent=g.lines;
  $('#gExlast').innerHTML=[0,1,2,3,4,5].map(n=>`<option value="${n}">${n?t('g_exlast_n',{n}):t('g_exlast_0')}</option>`).join('');$('#gExlast').value=g.exlast;
  $('#gExlastList').textContent=g.exlast?t('g_exlast_list',{list:[...c.lastN].sort((a,b)=>a-b).join(', ')}):'';
  $('#gSumLbl').textContent=t('g_sum',{a:c.range[0],b:c.range[1]});
  let h='';for(let v=1;v<=N;v++){const cl=g.inc.has(v)?'inc':g.exc.has(v)?'exc':c.lastN.has(v)?'auto':'';h+=`<button type="button" data-n="${v}" class="${cl}" aria-label="${v}${cl==='inc'?' – '+t('lg_inc'):cl==='exc'?' – '+t('lg_exc'):''}">${v}</button>`}
  $('#gGrid').innerHTML=h;const p=passRate();
  $('#gPass').textContent=p>0?t('g_pass',{p:p*100<.01?'<0.01':(p*100).toFixed(p<.01?2:1),t:nf(comb(N,7))}):t('g_pass0');
  $('#gGo').textContent=t(S.out.length?'g_again':'g_draw')}
function renderOut(anim){const o=$('#gOut');$('#gCopy').hidden=!S.out.length;
  if(!S.out.length){o.innerHTML=`<p class="cap" style="margin:0">${t('g_empty')}</p>`;return}
  o.innerHTML=S.out.map((l,i)=>{const s=l.reduce((a,x)=>a+x,0),od=l.filter(x=>x&1).length;
    return`<div class="lrow"><span class="lab">${t('line',{n:i+1})}</span><span class="balls">${l.map(v=>ball(v,'gold'+(anim?' wait':''))).join('')}</span><span class="meta">${t('sum_lbl',{s})} · ${t('oe_lbl',{o:od,e:7-od})}</span></div>`}).join('')}
function go(){if(S.busy)return;$('#gMsg').textContent='';const lines=drawLines();if(!lines){$('#gMsg').textContent=t('g_err');return}
  if(lines.length<S.g.lines)$('#gMsg').textContent=t('g_err');S.out=lines;
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;renderOut(!still);$('#gGo').textContent=t('g_again');if(still)return;
  S.busy=true;$('#gGo').disabled=true;$('#gGo').textContent=t('g_drawing');$('#drum').classList.add('spin');
  const bs=$$('#gOut .ball');bs.forEach((b,i)=>setTimeout(()=>b.classList.remove('wait'),500+i*(bs.length>35?55:90)));
  setTimeout(()=>{S.busy=false;$('#gGo').disabled=false;$('#gGo').textContent=t('g_again');$('#drum').classList.remove('spin')},650+bs.length*(bs.length>35?55:90))}

/* ---------- wiring ---------- */
function applyStatic(){document.documentElement.lang=S.lang;$$('[data-i18n]').forEach(e=>{e.textContent=t(e.dataset.i18n)});$('#lang').value=S.lang}
function renderAll(){PAST=new Set(DRAWS.map(d=>d.n.join('-')));applyStatic();renderHero();histOptions();renderHist();analysisOptions();renderAnalysis();renderPatterns();renderGenStatic();renderOut(false)}
function pickLang(){try{const s=localStorage.getItem('dn_lang');if(s&&I18N[s])return s}catch(e){}
  for(const l of navigator.languages||[navigator.language||'en']){const x=l.toLowerCase();if(/^zh-(tw|hk|mo|hant)/.test(x))return'zh-Hant';if(x.startsWith('zh'))return'zh-Hans';const b=x.split('-')[0];if(I18N[b])return b}return'en'}
function drum(){$$('#drum b').forEach((b,k)=>{let h='';const n=k?5:7,r=k?18:40;for(let i=0;i<n;i++){const a=i/n*6.283;h+=`<i style="left:${50+Math.cos(a)*r-8.3}%;top:${50+Math.sin(a)*r-8.3}%"></i>`}b.innerHTML=h})}
function bind(){
  $('#lang').onchange=e=>{S.lang=e.target.value;try{localStorage.setItem('dn_lang',S.lang)}catch(_){}renderAll()};
  const hf=()=>{S.h.year=$('#fYear').value;S.h.dow=$('#fDow').value;S.h.from=$('#fFrom').value;S.h.to=$('#fTo').value;
    S.h.nums=[...new Set(($('#fNums').value.match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=52))].slice(0,8);S.h.limit=10;renderHist()};
  ['fYear','fDow','fFrom','fTo'].forEach(i=>$('#'+i).onchange=hf);$('#fNums').oninput=hf;
  $('#fReset').onclick=()=>{S.h={year:'',dow:'',from:'',to:'',nums:[],limit:10};['fYear','fDow','fFrom','fTo','fNums'].forEach(i=>$('#'+i).value='');renderHist()};
  $('#hMore').onclick=()=>{S.h.limit+=10;renderHist()};$('#hAll').onclick=()=>{S.h.limit=1e9;renderHist()};
  $('#aScope').onchange=e=>{S.a.scope=e.target.value;renderAnalysis()};$('#aBonus').onchange=e=>{S.a.bonus=e.target.checked;renderAnalysis()};
  $('#aTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.a.view=b.dataset.v;analysisOptions();renderAnalysis()};
  $('#gLines').oninput=e=>{S.g.lines=+e.target.value;$('#gLinesOut').textContent=S.g.lines};
  $('#gExlast').onchange=e=>{S.g.exlast=+e.target.value;renderGenStatic()};
  [['gExcombo','excombo'],['gSum','sum'],['gOe','oe'],['gRun','run'],['gBday','bday']].forEach(([i,k])=>$('#'+i).onchange=e=>{S.g[k]=e.target.checked;renderGenStatic()});
  $('#gGrid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.n,g=S.g;$('#gMsg').textContent='';
    if(g.inc.has(v)){g.inc.delete(v);g.exc.add(v)}else if(g.exc.has(v))g.exc.delete(v);else if(g.inc.size>=6){$('#gMsg').textContent=t('g_max');g.exc.add(v)}else g.inc.add(v);renderGenStatic()};
  $('#gGo').onclick=go;
  $('#gCopy').onclick=()=>{const txt=S.out.map(l=>l.map(v=>String(v).padStart(2,'0')).join(' ')).join('\n'),b=$('#gCopy');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{b.textContent=t('copied');setTimeout(()=>b.textContent=t('copy'),1500)}).catch(()=>{$('#gMsg').textContent=txt.replace(/\n/g,' | ')})};
  const tip=$('#tip'),show=e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.display='none';return}tip.textContent=el.dataset.tip;tip.style.display='block';
    const r=el.getBoundingClientRect(),w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'};
  document.addEventListener('mouseover',show);document.addEventListener('click',show);addEventListener('scroll',()=>tip.style.display='none',{passive:true})}
function loadLive(){fetch('data/draws.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!Array.isArray(j))return;const by=new Map(DRAWS.map(d=>[d.k,d]));let add=0;
  for(const x of j){if(!x||!/^\d{4}-\d\d-\d\d$/.test(x.date)||!Array.isArray(x.numbers)||x.numbers.length!==7)continue;const k=+x.date.replace(/-/g,''),n=x.numbers.map(Number).sort((a,b)=>a-b),b=+x.bonus,P=poolOf(k);
    if(new Set(n.concat(b)).size!==8||n.concat(b).some(v=>!(v>=1&&v<=P)))continue;if(!by.has(k))add++;by.set(k,mk(k,n,b))}
  if(add){DRAWS=[...by.values()].sort((a,b)=>a.k-b.k);renderAll()}}).catch(()=>{})}
S.lang=pickLang();drum();bind();renderAll();loadLive();

</script>
