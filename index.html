<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DrawNight — Lotto Max Data Analyzer</title>
<meta name="description" content="Every Lotto Max draw since 2009, counted and checked. Statistics, a number checker and a fair random number generator.">
<meta property="og:title" content="DrawNight — Lotto Max Data Analyzer">
<meta property="og:description" content="Every Lotto Max draw since 2009, counted and checked.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23f6bb45'/%3E%3Ccircle cx='24' cy='22' r='9' fill='%23fff3c4' opacity='.55'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='700' text-anchor='middle' fill='%23201503'%3E7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Draw night: one dark stage, gold balls are the only loud thing. Long scroll, sticky rail of five sections. */
  --night:#090d1d; --stage:#111733; --rail:#1a2146; --line:#2b3566;
  --ink:#f4f0e4; --dim:#b3bad4; --gold:#f6bb45; --gold-deep:#b9790a; --bonus:#62d6c6; --bar:#8494dc; --warn:#ff9d7a;
  --measure:680px;
  --display:"Big Shoulders Display","Figtree","PingFang HK","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  --body:"Figtree","PingFang HK","PingFang SC","Microsoft JhengHei","Microsoft YaHei","Noto Sans TC","Noto Sans SC","Nirmala UI","Noto Sans Gurmukhi","Noto Sans Devanagari",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--night);color:var(--ink);font:16px/1.55 var(--body);
  background-image:radial-gradient(900px 420px at 18% -80px,#27307099,transparent 70%),radial-gradient(700px 380px at 95% 0,#3a2a0a66,transparent 70%);background-repeat:no-repeat}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:.01em;line-height:1.05;margin:0;text-wrap:balance}
h2{font-size:clamp(30px,4.6vw,46px);text-transform:uppercase}
h3{font-size:21px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p{margin:0;text-wrap:pretty}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* top rail */
.top{position:sticky;top:0;z-index:30;background:#090d1de6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:60px;flex-wrap:wrap;padding-top:6px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;color:var(--ink);flex:none}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff3c4,var(--gold) 45%,var(--gold-deep));box-shadow:0 0 14px #f6bb4566;color:#201503;font-style:normal;font-size:17px;display:grid;place-items:center;line-height:1}
.top nav{display:flex;gap:2px;flex:1;flex-wrap:wrap}
.top nav a{color:var(--dim);text-decoration:none;padding:6px 9px;border-radius:6px;font-weight:600;font-size:15px;white-space:nowrap}
.top nav a:hover{color:var(--ink);background:var(--rail)}
.langbox{display:flex;align-items:center;gap:6px;flex:none}
.langbox svg{width:18px;height:18px;stroke:var(--dim);fill:none;stroke-width:1.7;flex:none}
select,input[type=text],input[type=date],input[type=number]{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
select:hover,input:hover{border-color:var(--dim)}

/* balls */
.ball{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--rail);border:1px solid var(--line);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;flex:none}
.ball.bonus{background:transparent;border:1.5px solid var(--bonus);color:var(--bonus)}
.ball.gold{background:radial-gradient(circle at 32% 26%,#fff6d0,var(--gold) 42%,var(--gold-deep));color:#201503;border:0;box-shadow:inset 0 -3px 6px #0003}
.ball.miss{opacity:.45}
.balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.plus{color:var(--dim);font-weight:700;padding:0 2px}

/* hero */
.hero{padding:40px 0 34px}
.hero .wrap{display:grid;grid-template-columns:1.5fr 1fr;gap:34px;align-items:end}
.kicker{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
h1{font-size:clamp(38px,6vw,70px);text-transform:uppercase;margin:10px 0 24px}
.latest-label{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;color:var(--dim);margin-bottom:12px;font-size:15px}
.latest-label b{color:var(--ink);font-size:18px}
.hero .balls{gap:clamp(3px,1vw,10px);flex-wrap:nowrap}
.hero .ball{width:clamp(30px,8.2vw,58px);height:clamp(30px,8.2vw,58px);font-family:var(--display);font-weight:800;font-size:clamp(16px,4vw,33px)}
.hero .ball.gold{box-shadow:inset 0 -5px 10px #0003,0 0 26px #f6bb4540}
.hero .ball.bonus{border-width:2px}
.hero .plus{padding:0;font-size:14px}
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:24px;background:var(--gold);color:#201503;border:0;border-radius:12px;padding:13px 24px;font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;min-height:52px}
.cta:hover{background:#ffd06d}
.cta i{width:20px;height:20px;border-radius:50%;background:#201503;color:var(--gold);font-style:normal;font-size:13px;display:grid;place-items:center;font-family:var(--body);line-height:1}
.side{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side div{background:var(--stage);padding:13px 18px}
.side small{display:block;color:var(--dim);font-size:13px}
.side b{font-family:var(--display);font-size:29px;font-weight:800;letter-spacing:.02em;display:block}
.side em{font-style:normal;font-size:13px;color:var(--dim);display:block;margin-top:1px}
.side #oddsLine{font-size:clamp(20px,2.1vw,27px);line-height:1.15}
.side .next b{color:var(--gold)}
.side .next em{color:var(--ink);font-size:15px;margin-top:3px}
.note{margin-top:14px;color:var(--dim);font-size:14px}
.note.warn{color:var(--warn)}

section{padding:50px 0;border-top:1px solid var(--line)}
.sub{color:var(--dim);max-width:var(--measure);margin:10px 0 20px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.filters label{display:grid;gap:4px;font-size:13px;color:var(--dim);font-weight:600}
.filters label.check{display:flex;color:var(--ink);font-size:15px;font-weight:400;padding-bottom:9px}
.btn{background:var(--rail);border:1px solid var(--line);border-radius:8px;padding:8px 14px;min-height:40px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold);color:var(--gold)}

/* ad slots: paste your ad code inside the div. Empty slots stay hidden. */
.ad-slot{max-width:1120px;margin:0 auto;padding:18px 20px;text-align:center}
.ad-slot:empty{display:none}
.ad-slot::before{content:attr(data-label);display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);opacity:.6;margin-bottom:8px}

/* history table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--stage)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:700}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums;color:var(--dim)}
.tfoot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;color:var(--dim);font-size:14px}

/* analysis */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 18px}
.tabs button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--dim);font-weight:600}
.tabs button:hover{color:var(--ink);border-color:var(--dim)}
.tabs button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#201503}
.panel{background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:22px}
.cap{color:var(--dim);font-size:14px;margin-bottom:14px;max-width:var(--measure)}
.note-sm{color:var(--dim);font-size:13.5px;line-height:1.6;margin-top:16px;max-width:var(--measure);border-left:2px solid var(--line);padding-left:14px}
.sub+.note-sm{margin:-8px 0 22px}
.filters+.note-sm{margin:-4px 0 18px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;line-height:1.4}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.chartwrap{overflow-x:auto;padding-top:8px}
.chart{display:grid;grid-template-columns:auto 1fr;column-gap:8px;min-width:var(--minw,0)}
.yax{display:flex;flex-direction:column;justify-content:space-between;height:220px;font-size:11px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.yax span{line-height:1;transform:translateY(-50%)}.yax span:last-child{transform:translateY(50%)}
.plot{height:220px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid var(--dim);background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.col{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative}
.bar{width:100%;max-width:38px;background:var(--bar);border-radius:4px 4px 0 0;min-height:1px}
.col:hover .bar{background:var(--gold)}
.tick{position:absolute;left:0;right:0;margin:auto;max-width:42px;height:2px;background:var(--ink);box-shadow:0 0 0 1px var(--stage)}
.xax{grid-column:2;display:flex;gap:2px;font-size:11px;color:var(--dim);padding-top:6px;font-variant-numeric:tabular-nums}
.xax span{flex:1;min-width:0;text-align:center;white-space:nowrap}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:12px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.legend .lb{width:12px;height:12px;background:var(--bar);border-radius:3px 3px 0 0}.legend .lt{width:16px;height:2px;background:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.rank{display:grid;gap:8px;margin-top:10px}
.rank div{display:flex;align-items:center;gap:10px}
.rank .meter{flex:1;height:8px;background:var(--rail);border-radius:4px;overflow:hidden;min-width:24px}
.rank .meter i{display:block;height:100%;background:var(--bar);border-radius:0 4px 4px 0}
.rank span.v{color:var(--dim);font-size:13.5px;font-variant-numeric:tabular-nums;min-width:13ch;text-align:right}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--bonus);border:1px solid var(--bonus);border-radius:999px;padding:1px 6px;margin-left:-4px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#000d;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:260px;display:none}

/* findings */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.card{background:var(--stage);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;gap:9px;align-content:start}
.card h3{font-size:19px;text-transform:none;letter-spacing:0;font-weight:600;font-family:var(--display);line-height:1.15}
.card p{color:var(--dim);font-size:15px}
details.more{margin-top:16px}
details.more summary{cursor:pointer;color:var(--gold);font-weight:600;padding:8px 0;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"– "}
details.more .cards{margin-top:10px}

/* checker */
.chk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.chkin{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}
.chkin input{width:58px;text-align:center;font-weight:700;font-size:17px;padding:8px 4px;-moz-appearance:textfield}
.chkin input::-webkit-outer-spin-button,.chkin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.res{display:grid;gap:16px}
.res h3{font-size:15px;letter-spacing:.06em;color:var(--dim)}
.res b{font-family:var(--display);font-size:26px;font-weight:800;display:block;margin:4px 0}
.res .when{color:var(--dim);font-size:14px}

/* generator */
.gen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.opts{display:grid;gap:14px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.row output{font-family:var(--display);font-size:28px;font-weight:800;color:var(--gold);min-width:2ch}
input[type=range]{accent-color:var(--gold);flex:1;min-width:140px}
.hint{color:var(--dim);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:6px;margin-top:8px}
.grid button{aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--rail);cursor:pointer;font-weight:700;font-size:14px;padding:0}
.grid button:hover{border-color:var(--dim)}
.grid button.inc{background:var(--gold);color:#201503;border-color:var(--gold)}
.grid button.exc{background:transparent;color:#6c7499;text-decoration:line-through;border-style:dashed}
.grid button.auto{opacity:.35}
.keyl{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin-top:8px}
.keyl i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.machine{position:sticky;top:80px;display:grid;gap:18px}
.drumrow{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.drum{width:120px;height:120px;border-radius:50%;border:2px solid var(--line);background:radial-gradient(circle at 35% 30%,#2a3470,#0c1024 70%);position:relative;flex:none;box-shadow:inset 0 0 30px #000a}
.drum b{position:absolute;inset:0;animation:spin 14s linear infinite}
.drum b:nth-child(2){animation-duration:19s;animation-direction:reverse}
.drum b i{position:absolute;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff6d0,var(--gold) 45%,var(--gold-deep))}
.drum.spin b{animation-duration:.7s}.drum.spin b:nth-child(2){animation-duration:.95s}
@keyframes spin{to{transform:rotate(360deg)}}
.go{background:var(--gold);color:#201503;border:0;border-radius:12px;padding:14px 26px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:56px}
.go:hover{background:#ffd06d}.go:disabled{opacity:.6;cursor:wait}
.lines{display:grid;gap:10px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .lab{font-family:var(--display);font-weight:600;font-size:18px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;min-width:5ch}
.lrow .meta{grid-column:2;font-size:13px;color:var(--dim)}
.lrow .ball{width:40px;height:40px;font-size:17px;transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
.lrow .ball.wait{opacity:0;transform:scale(.3) translateY(-14px)}
.msg{color:var(--warn);font-size:14px;min-height:1.4em}

/* quick generator dialog */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--stage);color:var(--ink);padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;box-shadow:0 30px 80px #000a}
dialog::backdrop{background:#04060fcc;backdrop-filter:blur(3px)}
.dlg{padding:22px}
.dlg-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.dlg h2{font-size:28px}
.xbtn{background:transparent;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;color:var(--dim);font-size:18px;line-height:1;flex:none}
.xbtn:hover{color:var(--ink);border-color:var(--dim)}
.dlg .lines{margin-top:16px;min-height:60px}
.dlg .lrow .ball{width:36px;height:36px;font-size:16px}
.dlg-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.dlg-foot a{font-weight:600;font-size:14.5px}

/* back to top */
#toTop{position:fixed;right:22px;bottom:22px;z-index:25;width:56px;height:56px;border-radius:50%;border:1px solid var(--gold);background:var(--gold);color:#201503;cursor:pointer;font-size:26px;line-height:1;display:none;box-shadow:0 8px 24px #0006}
#toTop.on{display:block}
#toTop:hover{background:#ffd06d}

footer{border-top:1px solid var(--line);padding:34px 0 72px;color:var(--dim);font-size:13.5px}
.foot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px 30px}
.foot-grid h3{font-size:13px;letter-spacing:.1em;color:var(--ink);margin-bottom:7px;font-family:var(--body);font-weight:700}
footer p{max-width:60ch;line-height:1.55}

@media (max-width:860px){
  .hero .wrap,.gen,.two,.chk{grid-template-columns:1fr}
  .machine{position:static}
  .top .wrap{gap:6px 12px;min-height:54px}
  .top nav{order:3;flex-basis:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .top nav::-webkit-scrollbar{display:none}
  .top nav a{padding:4px 8px;font-size:14px}
  .langbox{margin-left:auto}
  html{scroll-padding-top:116px}
}
:lang(zh) h1{font-size:clamp(26px,7vw,54px);line-height:1.2}
:lang(pa) h1,:lang(hi) h1{font-size:clamp(28px,4.2vw,48px);line-height:1.35}
:lang(pa) h2,:lang(hi) h2,:lang(pa) h3,:lang(hi) h3{line-height:1.4}
:lang(pa) .cta,:lang(hi) .cta,:lang(pa) .go,:lang(hi) .go{font-size:19px;line-height:1.3}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.drum b{animation:none}.lrow .ball{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="#top"><i>7</i>DrawNight</a>
  <nav>
    <a href="#results" data-i18n="nav_history"></a>
    <a href="#analysis" data-i18n="nav_analysis"></a>
    <a href="#patterns" data-i18n="nav_patterns"></a>
    <a href="#checker" data-i18n="nav_checker"></a>
    <a href="#generator" data-i18n="nav_generator"></a>
  </nav>
  <div class="langbox">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>
    <select id="lang" aria-label="Language">
      <option value="en">English</option><option value="fr">Français</option><option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option><option value="pa">ਪੰਜਾਬੀ</option><option value="hi">हिन्दी</option>
    </select>
  </div>
</div></header>

<main id="top">
<div class="hero"><div class="wrap">
  <div>
    <div class="kicker" data-i18n="hero_kicker"></div>
    <h1 data-i18n="hero_title" data-br></h1>
    <div class="latest-label"><span data-i18n="hero_latest"></span><b id="latestDate"></b></div>
    <div class="balls" id="latestBalls"></div>
    <p class="note" id="fresh"></p>
    <button class="cta" id="heroGen"><i>7</i><span data-i18n="cta_generate"></span></button>
  </div>
  <div class="side">
    <div class="next"><small data-i18n="next_draw"></small><b id="nextDraw"></b><em id="nextJackpot"></em></div>
    <div><small data-i18n="draws_recorded"></small><b id="nDraws"></b><em id="sinceYear"></em></div>
    <div><small data-i18n="pool_now"></small><b id="poolNow"></b></div>
    <div><small data-i18n="odds_title"></small><b id="oddsLine"></b><em id="oddsPlay"></em></div>
  </div>
</div></div>

<!-- Ad slot 1. Paste your ad code between the div tags. -->
<div class="ad-slot" id="ad1"></div>

<section id="results"><div class="wrap">
  <h2 data-i18n="h_title"></h2>
  <p class="sub" data-i18n="h_sub"></p>
  <div class="filters">

foot_rp:"ਲਾਟਰੀ ਡਰਾਅ ਬੇਤਰਤੀਬ ਹੁੰਦੇ ਹਨ। ਕੋਈ ਵਿਸ਼ਲੇਸ਼ਣ, ਰੁਝਾਨ ਜਾਂ ਨੰਬਰ ਜਨਰੇਟਰ ਜਿੱਤਣ ਦੀ ਸੰਭਾਵਨਾ ਨਹੀਂ ਵਧਾ ਸਕਦਾ। ਟਿਕਟ ਖਰੀਦਣ ਲਈ ਤੁਹਾਡੀ ਉਮਰ ਤੁਹਾਡੇ ਸੂਬੇ ਦੀ ਕਾਨੂੰਨੀ ਉਮਰ ਜਿੰਨੀ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ। ਬਜਟ ਤੈਅ ਕਰੋ ਅਤੇ ਉਸੇ ਵਿੱਚ ਰਹੋ।",
foot_ind_t:"ਸੁਤੰਤਰ ਸਾਈਟ",
foot_ind:"DrawNight ਦਾ OLG, BCLC, WCLC, Loto-Québec, Atlantic Lottery ਜਾਂ Interprovincial Lottery Corporation ਨਾਲ ਕੋਈ ਸੰਬੰਧ ਨਹੀਂ, ਨਾ ਹੀ ਇਹ ਉਨ੍ਹਾਂ ਵੱਲੋਂ ਮਨਜ਼ੂਰਸ਼ੁਦਾ ਹੈ। ਅਸੀਂ ਟਿਕਟਾਂ ਨਹੀਂ ਵੇਚਦੇ ਅਤੇ ਕੋਈ ਸੱਟਾ ਨਹੀਂ ਲੈਂਦੇ। LOTTO MAX ਅਤੇ ਹੋਰ ਉਤਪਾਦ ਨਾਮ ਆਪਣੇ-ਆਪਣੇ ਮਾਲਕਾਂ ਦੇ ਟ੍ਰੇਡਮਾਰਕ ਹਨ, ਇੱਥੇ ਸਿਰਫ਼ ਖੇਡ ਦੀ ਪਛਾਣ ਲਈ ਵਰਤੇ ਗਏ ਹਨ।",

foot_data:"ਡਰਾਅ ਦੇ ਨਤੀਜੇ ਜਨਤਕ ਤੌਰ 'ਤੇ ਉਪਲਬਧ ਲਾਟਰੀ ਡਾਟੇ ਤੋਂ ਇਕੱਠੇ ਕੀਤੇ ਜਾਂਦੇ ਹਨ ਅਤੇ ਜਿੱਥੇ ਸੰਭਵ ਹੋਵੇ ਇੱਕ ਤੋਂ ਵੱਧ ਸਰੋਤ ਨਾਲ ਮਿਲਾਏ ਜਾਂਦੇ ਹਨ। {date} ਤੱਕ ਅੱਪਡੇਟ। ਜਾਣਕਾਰੀ ਜਿਵੇਂ ਹੈ ਉਵੇਂ ਦਿੱਤੀ ਜਾਂਦੀ ਹੈ, ਸ਼ੁੱਧਤਾ ਜਾਂ ਸੰਪੂਰਨਤਾ ਦੀ ਕੋਈ ਗਾਰੰਟੀ ਨਹੀਂ। ਅਧਿਕਾਰਤ ਨਤੀਜੇ ਹੀ ਮੰਨੇ ਜਾਣਗੇ — ਇਨਾਮ ਲੈਣ ਤੋਂ ਪਹਿਲਾਂ ਆਪਣੀ ਟਿਕਟ ਅਧਿਕਾਰਤ ਤਰੀਕੇ ਨਾਲ ਜਾਂਚੋ।",

function scopeDraws(){const s=S.a.scope;if(s==='cur')return DRAWS.filter(d=>d.k>=ERAS[0][0]);if(s==='e50')return DRAWS.filter(d=>d.pool===50);if(s==='e49')return DRAWS.filter(d=>d.pool===49);if(s==='l50')return DRAWS.slice(-50);if(s==='l100')return DRAWS.slice(-100);return DRAWS}
const picks=d=>S.a.bonus?d.n.concat(d.b):d.n;
function freqData(ds){const N=Math.max(...ds.map(d=>d.pool)),k=S.a.bonus?8:7,out=[];
  for(let v=1;v<=N;v++){let c=0,el=0,ex=0;for(const d of ds){if(d.pool<v)continue;el++;ex+=k/d.pool;if(picks(d).includes(v))c++}out.push({v,c,el,p:el?c/el:0,e:el?ex/el:0})}return out}

    const row=x=>({h:ball(x.v)+(x.el<m?`<span class="tag">${t('new_badge')}</span>`:''),v:x.p,t:t('rank_val',{c:nf(x.c),m:nf(x.el),p:pc(x.p)})});

      (mixed?`<p class="note-sm">${t('freq_note_new')}</p>`:'')}
  else if(v==='gap'){const g=[];const never=[];for(let x=1;x<=N;x++){let idx=-1;for(let i=m-1;i>=0;i--)if(picks(ds[i]).includes(x)){idx=i;break}idx<0?never.push(x):g.push({v:x,g:m-1-idx})}
    g.sort((a,b)=>b.g-a.g);const top=g.slice(0,12),mx=top[0]?Math.max(1,top[0].g):1;

  else if(v==='pairs'){const P=new Map(),T=new Map();for(const d of ds){const n=d.n;for(let i=0;i<7;i++)for(let j=i+1;j<7;j++){const a=n[i]*100+n[j];P.set(a,(P.get(a)||0)+1);for(let k=j+1;k<7;k++){const b=a*100+n[k];T.set(b,(T.get(b)||0)+1)}}}
    const top=(M,n)=>[...M].sort((a,b)=>b[1]-a[1]||a[0]-b[0]).slice(0,n);const tp=top(P,12),tt=top(T,8);
    const ex=ds.reduce((a,d)=>a+42/(d.pool*(d.pool-1)),0);

    h+=t('sum_cap')+'</p>'+barChart(bins.map(x=>{const l=x.b+'–'+(x.b+19);return{l,v:x.c/m*100,tip:t('tip_sum',{l,c:x.c,p:pc(x.c/m)})}}),{minw:560})+
      `<p class="note-sm">${t('sum_note',{a:pctl(ds,.1),b:pctl(ds,.9)})}</p>`}
  else{const c=[0,0,0,0];let cons=0;ds.forEach((d,i)=>{if(hasCons(d.n))cons++;if(i){const j=d.n.filter(x=>ds[i-1].n.includes(x)).length;c[Math.min(3,j)]++}});const mm=Math.max(1,m-1);

  $('#aPanel').innerHTML=h}

let CLOSE=null;
function closest(){if(CLOSE&&CLOSE.n===DRAWS.length)return CLOSE;const lo=[],hi=[];DRAWS.forEach(d=>{let a=0,b=0;d.n.forEach(v=>v<=26?a|=1<<v:b|=1<<(v-26));lo.push(a);hi.push(b)});
  const pop=x=>{x-=x>>>1&0x55555555;x=(x&0x33333333)+(x>>>2&0x33333333);return(x+(x>>>4)&0xf0f0f0f)*0x1010101>>>24};let best=[0,0,0];
  for(let i=0;i<lo.length;i++)for(let j=i+1;j<lo.length;j++){const k=pop(lo[i]&lo[j])+pop(hi[i]&hi[j]);if(k>best[0])best=[k,i,j]}return CLOSE={n:DRAWS.length,k:best[0],a:DRAWS[best[1]],b:DRAWS[best[2]]}}
function renderFindings(){const ds=DRAWS,m=ds.length,cl=closest(),r=sumRange(),cur=ds.filter(d=>d.k>=ERAS[0][0]);

    return`<div class="card${lead?' lead':''}"><h3>${t(key)}</h3><p>${t(bkey,v)}</p></div>`};

/* ---------- generator ---------- */
function rint(n){const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}
function genCtx(){const N=POOL(),g=S.g,lastN=new Set();if(g.exlast)DRAWS.slice(-g.exlast).forEach(d=>d.n.forEach(x=>lastN.add(x)));
  const inc=[...g.inc].filter(x=>x<=N).sort((a,b)=>a-b),avail=[];for(let v=1;v<=N;v++)if(!g.inc.has(v)&&!g.exc.has(v)&&!lastN.has(v))avail.push(v);
  return{N,inc,avail,lastN,need:7-inc.length,range:sumRange()}}
function sample(c,r){const a=c.avail.slice(),out=c.inc.slice();for(let i=0;i<c.need;i++){const j=i+r(a.length-i),x=a[i];a[i]=a[j];a[j]=x;out.push(a[i])}return out.sort((x,y)=>x-y)}
function passes(l,c){const g=S.g;if(g.sum){const s=l.reduce((a,x)=>a+x,0);if(s<c.range[0]||s>c.range[1])return false}
  if(g.oe){const o=l.filter(x=>x&1).length;if(o<2||o>5)return false}
  if(g.run)for(let i=0;i<5;i++)if(l[i+1]-l[i]===1&&l[i+2]-l[i+1]===1)return false;
  if(g.bday&&l[6]<=31)return false;if(g.excombo&&PAST.has(l.join('-')))return false;return true}
function passesNoCombo(l,c){const was=S.g.excombo;S.g.excombo=false;const r=passes(l,c);S.g.excombo=was;return r}
function filterCount(){const g=S.g;return(g.exlast?1:0)+(g.excombo?1:0)+(g.sum?1:0)+(g.oe?1:0)+(g.run?1:0)+(g.bday?1:0)+(g.inc.size?1:0)+(g.exc.size?1:0)}
function passCount(){const c=genCtx(),total=comb(c.N,7);if(c.avail.length<c.need)return{total,pass:0};
  let ok=0;const M=3000,r=n=>Math.floor(Math.random()*n);for(let i=0;i<M;i++)if(passesNoCombo(sample(c,r),c))ok++;
  let pass=Math.round(comb(c.avail.length,c.need)*ok/M);
  if(S.g.excombo){let hit=0;const incSet=new Set(c.inc);
    PAST.forEach((d,key)=>{const l=key.split('-').map(Number);
      if(l.some(x=>x>c.N||S.g.exc.has(x)||c.lastN.has(x)))return;
      for(const v of incSet)if(!l.includes(v))return;
      if(passesNoCombo(l,c))hit++});
    pass=Math.max(0,pass-hit)}
  return{total,pass}}
function drawLines(n){const c=genCtx(),out=[],seen=new Set();if(c.avail.length<c.need)return null;
  for(let i=0;i<n;i++){let l=null;for(let k=0;k<60000;k++){const x=sample(c,rint),key=x.join('-');if(!seen.has(key)&&passes(x,c)){l=x;seen.add(key);break}}if(!l)return out.length?out:null;out.push(l)}return out}
function renderGenStatic(){const g=S.g,c=genCtx(),N=c.N,total=comb(N,7);
  $('#gLines').value=g.lines;$('#gLinesOut').textContent=g.lines;
  $('#gExlast').innerHTML=[0,1,2,3,4,5].map(n=>`<option value="${n}">${n?t('g_exlast_n',{n}):t('g_exlast_0')}</option>`).join('');$('#gExlast').value=g.exlast;
  $('#gExlastList').textContent=g.exlast?t('g_exlast_list',{list:[...c.lastN].sort((a,b)=>a-b).join(', ')}):'';
  $('#gSumLbl').textContent=t('g_sum',{a:c.range[0],b:c.range[1]});
  let h='';for(let v=1;v<=N;v++){const cl=g.inc.has(v)?'inc':g.exc.has(v)?'exc':c.lastN.has(v)?'auto':'';h+=`<button type="button" data-n="${v}" class="${cl}" aria-label="${v}${cl==='inc'?' – '+t('lg_inc'):cl==='exc'?' – '+t('lg_exc'):''}">${v}</button>`}
  $('#gGrid').innerHTML=h;
  const nF=filterCount();
  if(!nF)$('#gPass').textContent=t('g_pass_none',{t:nf(total)});
  else{const{pass}=passCount(),p=pass/total;
    if(pass<=0)$('#gPass').textContent=t('g_pass0');
    else{const pctTxt=p*100>99.9?'99.9+':p*100<.01?'<0.01':(p*100).toFixed(p<.01?2:1);
      $('#gPass').textContent=t('g_pass',{p:pctTxt,t:nf(total),r:nf(total-pass)})}}
  $('#gGo').textContent=t(S.out.length?'g_again':'g_draw');
  $('#qFilters').textContent=nF?t('m_filters_on',{n:nF}):t('m_filters_off')}

function applyStatic(){document.documentElement.lang=S.lang;
  $$('[data-i18n]').forEach(e=>{const v=t(e.dataset.i18n);
    if(e.hasAttribute('data-br'))e.innerHTML=v.split('|').map(x=>x.trim().replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))).join('<br>');
    else e.textContent=v.split('|').join('')});
  $('#lang').value=S.lang;
  $$('.ad-slot').forEach(e=>e.dataset.label=t('ad_label')||'Advertisement')}
function renderAll(){PAST=new Map(DRAWS.map(d=>[d.n.join('-'),d.d]));CLOSE=null;applyStatic();renderHero();histOptions();renderHist();
  analysisOptions();renderAnalysis();renderFindings();renderChkInputs();renderChkResult();renderGenStatic();
  $('#gOut').innerHTML=linesHtml(S.out,false);$('#gCopy').hidden=!S.out.length;
  $('#qOut').innerHTML=S.q.out.length?linesHtml(S.q.out,false):'';$('#qCopy').hidden=!S.q.out.length;
  $('#qLines').value=S.q.lines;$('#qLinesOut').textContent=S.q.lines}
function pickLang(){try{const s=localStorage.getItem('dn_lang');if(s&&I18N[s])return s}catch(e){}
  for(const l of navigator.languages||[navigator.language||'en']){const x=l.toLowerCase();if(/^zh-(tw|hk|mo|hant)/.test(x))return'zh-Hant';if(x.startsWith('zh'))return'zh-Hans';const b=x.split('-')[0];if(I18N[b])return b}return'en'}
function drum(){$$('#drum b').forEach((b,k)=>{let h='';const n=k?5:7,r=k?18:40;for(let i=0;i<n;i++){const a=i/n*6.283;h+=`<i style="left:${50+Math.cos(a)*r-8.3}%;top:${50+Math.sin(a)*r-8.3}%"></i>`}b.innerHTML=h})}
function bind(){
  $('#lang').onchange=e=>{S.lang=e.target.value;try{localStorage.setItem('dn_lang',S.lang)}catch(_){}renderAll()};
  const hf=()=>{S.h.year=$('#fYear').value;S.h.dow=$('#fDow').value;S.h.from=$('#fFrom').value;S.h.to=$('#fTo').value;
    S.h.nums=[...new Set(($('#fNums').value.match(/\d+/g)||[]).map(Number).filter(v=>v>=1&&v<=52))].slice(0,8);S.h.limit=10;renderHist()};
  ['fYear','fDow','fFrom','fTo'].forEach(i=>$('#'+i).onchange=hf);$('#fNums').oninput=hf;
  const reset=()=>{S.h={year:'',dow:'',from:'',to:'',nums:[],limit:10};['fYear','fDow','fFrom','fTo','fNums'].forEach(i=>$('#'+i).value='');renderHist()};
  $('#fReset').onclick=reset;$('#fReset2').onclick=()=>{reset();$('#results').scrollIntoView()};
  $('#hMore').onclick=()=>{S.h.limit+=10;renderHist()};$('#hAll').onclick=()=>{S.h.limit=1e9;renderHist()};
  $('#aScope').onchange=e=>{S.a.scope=e.target.value;renderAnalysis()};$('#aBonus').onchange=e=>{S.a.bonus=e.target.checked;renderAnalysis()};
  $('#aTabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.a.view=b.dataset.v;analysisOptions();renderAnalysis()};
  $('#chkGo').onclick=doCheck;
  $('#chkClear').onclick=()=>{S.chk=[];$('#chkMsg').textContent='';renderChkInputs();renderChkResult()};
  $('#chkIn').addEventListener('input',e=>{const i=e.target,all=$$('#chkIn input'),k=all.indexOf(i);
    if(i.value.length>=2&&k<6&&+i.value>5)all[k+1].focus()});
  $('#chkIn').addEventListener('keydown',e=>{if(e.key==='Enter')doCheck()});
  $('#gLines').oninput=e=>{S.g.lines=+e.target.value;$('#gLinesOut').textContent=S.g.lines};
  $('#gExlast').onchange=e=>{S.g.exlast=+e.target.value;renderGenStatic()};
  [['gExcombo','excombo'],['gSum','sum'],['gOe','oe'],['gRun','run'],['gBday','bday']].forEach(([i,k])=>$('#'+i).onchange=e=>{S.g[k]=e.target.checked;renderGenStatic()});
  $('#gGrid').onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=+b.dataset.n,g=S.g;$('#gMsg').textContent='';
    if(g.inc.has(v)){g.inc.delete(v);g.exc.add(v)}else if(g.exc.has(v))g.exc.delete(v);else if(g.inc.size>=6){$('#gMsg').textContent=t('g_max');g.exc.add(v)}else g.inc.add(v);renderGenStatic()};
  $('#gGo').onclick=go;
  $('#gCopy').onclick=()=>copyLines(S.out,$('#gCopy'));
  const dlg=$('#quick');
  $('#heroGen').onclick=()=>{try{dlg.showModal()}catch(e){location.hash='#generator'}};
  $('#qClose').onclick=()=>dlg.close();
  $('#qLines').oninput=e=>{S.q.lines=+e.target.value;$('#qLinesOut').textContent=S.q.lines};
  $('#qGo').onclick=qGo;
  $('#qCopy').onclick=()=>copyLines(S.q.out,$('#qCopy'));
  $('#qMore').onclick=()=>{dlg.close()};
  $('#toTop').onclick=()=>scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  addEventListener('scroll',()=>{$('#toTop').classList.toggle('on',scrollY>700)},{passive:true});
  const tip=$('#tip'),show=e=>{const el=e.target.closest&&e.target.closest('[data-tip]');if(!el){tip.style.display='none';return}tip.textContent=el.dataset.tip;tip.style.display='block';
    const r=el.getBoundingClientRect(),w=tip.offsetWidth;tip.style.left=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2))+'px';tip.style.top=Math.max(8,r.top-tip.offsetHeight-8)+'px'};
  document.addEventListener('mouseover',show);document.addEventListener('click',show);addEventListener('scroll',()=>tip.style.display='none',{passive:true})}
function loadLive(){
  fetch('data/draws.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(!Array.isArray(j))return;const by=new Map(DRAWS.map(d=>[d.k,d]));let add=0;
    for(const x of j){if(!x||!/^\d{4}-\d\d-\d\d$/.test(x.date)||!Array.isArray(x.numbers)||x.numbers.length!==7)continue;const k=+x.date.replace(/-/g,''),n=x.numbers.map(Number).sort((a,b)=>a-b),b=+x.bonus,P=poolOf(k);
      if(new Set(n.concat(b)).size!==8||n.concat(b).some(v=>!(v>=1&&v<=P)))continue;if(!by.has(k))add++;by.set(k,mk(k,n,b))}
    if(add){DRAWS=[...by.values()].sort((a,b)=>a.k-b.k);renderAll()}}).catch(()=>{});
  fetch('data/next.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{
    if(j&&/^\d{4}-\d\d-\d\d$/.test(j.date)&&typeof j.jackpot==='number'&&j.jackpot>0){NEXT=j;renderHero()}}).catch(()=>{})}
S.lang=pickLang();drum();bind();renderAll();loadLive();

</script>
