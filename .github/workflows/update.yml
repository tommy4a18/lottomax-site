name: Update Lotto Max draws

on:
  schedule:
    # 攪珠：星期二、五晚 10:30pm 東岸時間 = UTC 星期三、六 02:30（夏令）或 03:30（冬令）
    # 1) 一般排程：UTC 02:05–05:50 每 15 分鐘試一次。讀唔到都唔會寄電郵。
    - cron: "5,20,35,50 2-5 * * 3,6"
    # 2) 檢查排程：UTC 06:47（攪珠後 3 小時以上）。仍然冇最新一期先寄一封電郵。
    - cron: "47 6 * * 3,6"
    # 3) 最後後備：UTC 13:17 再試一次。唔會寄電郵。
    - cron: "17 13 * * 3,6"
  workflow_dispatch:
    inputs:
      verify_all:
        description: "逐年覆核全部歷史數據（只報告，不修改）"
        type: boolean
        default: false
      mode:
        description: "內部用，唔使改"
        type: choice
        options: [manual, quiet, alert]
        default: manual
      attempt:
        description: "內部用，唔使改"
        type: string
        default: "1"

permissions:
  contents: write   # 寫入新數據
  actions: write    # 連唔到時自動開新機再試

# 同一時間只允許一個更新 run，避免兩個 run 同時 push 撞車
concurrency:
  group: update-draws
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # manual = 手動執行；alert = 檢查排程（會寄電郵）；quiet = 其他排程（唔寄電郵）
      RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '47 6 * * 3,6' && 'alert' || 'quiet') }}
      ATTEMPT: ${{ inputs.attempt || '1' }}
      MAX_ATTEMPTS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Verify full history
        if: ${{ inputs.verify_all }}
        run: python scripts/update_draws.py --verify-all
      - name: Fetch new draws
        if: ${{ !inputs.verify_all }}
        id: fetch
        continue-on-error: true
        run: |
          echo "執行模式：$RUN_MODE，第 $ATTEMPT / $MAX_ATTEMPTS 次"
          python scripts/update_draws.py
      - name: Commit and push new data
        if: ${{ !inputs.verify_all }}
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "沒有數據變化，略過 commit。"
            exit 0
          fi
          git config user.name "drawnight-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git commit -m "Update Lotto Max data"
          # 推送前先同步遠端，避免你手動改過檔案時失敗
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Retry on a new machine
        if: ${{ !inputs.verify_all && steps.fetch.outputs.retry == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run update.yml --ref "$GITHUB_REF_NAME" \
            -f mode="$RUN_MODE" -f attempt="$((ATTEMPT + 1))"
          echo "已排定第 $((ATTEMPT + 1)) 次嘗試。"
      - name: Report problems
        if: ${{ !inputs.verify_all && steps.fetch.outcome == 'failure' }}
        run: exit 1
